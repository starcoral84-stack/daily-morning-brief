<section class="sd sd-card" aria-label="Class schedule">
<style>
/*__CSS__*/
.sd-card{margin:0 0 1.5rem}
.sd-card h2{margin:0 0 .2rem}
.sd-card .sd-day{margin:.55rem 0}
</style>
<h2>Class schedule</h2>
<div id="sd-card-root"></div>
<p class="sd-foot"><a href="/schedule.html">Full schedule →</a> <span id="sd-card-upd"></span></p>
<noscript><p class="sd-foot"><a href="/schedule.html">Open the class schedule</a></p></noscript>
<script type="application/json" id="sched-data">/*__DATA__*/</script>
<script>
(function(){
/*__CORE__*/
const today = todayBkk(), tomorrow = addDays(today, 1);
let html = dayCard(today, 'Today', today) + dayCard(tomorrow, 'Tomorrow', today);
if (!summary(BY[tomorrow])) {
  let n = addDays(tomorrow, 1), i = 0;
  while (i < 14 && !summary(BY[n])) { n = addDays(n, 1); i++; }
  if (summary(BY[n])) html += dayCard(n, 'Next class day', today);
}
document.getElementById('sd-card-root').innerHTML = html;
document.getElementById('sd-card-upd').textContent = updatedLabel() ? '· ' + updatedLabel() : '';
})();
</script>
</section>
<!-- SCHEDULE:END -->
